name: Refresh activity

# Runs on GitHub's runners, daily at 06:00 UTC (03:00 in Florianópolis).
# Only refreshes the contribution heatmap: the language bar reads local git
# repositories, which do not exist here. That one runs on his machine via
# scripts/com.ronaldoscotti.site-activity.plist.
#
# The commit only happens when the data actually changed, so an idle day adds
# no noise to the history.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-activity.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain src/data/activity.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/activity.json
          git commit -m "chore: refresh activity"
          git push
