name: Refresh activity

# Runs on GitHub's runners, daily at 06:00 UTC (03:00 in Florianópolis).
# Only refreshes the contribution heatmap: the language bar reads local git
# repositories, which do not exist here. That one runs on his machine via
# scripts/com.ronaldoscotti.site-activity.plist.
#
# The change lands through a pull request that auto-merges once tests pass —
# never a direct push to main — and only when the data actually changed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-activity.mjs

      - name: Open an auto-merging PR if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/data/activity.json)" ]; then
            echo "no change"
            exit 0
          fi

          # Guardrail before committing: a malformed activity.json fails here and
          # no PR is opened.
          node --test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work="activity/$(date '+%Y%m%d-%H%M%S')"
          git switch -c "$work"
          git add src/data/activity.json
          git commit -m "chore: refresh activity"
          git push -u origin "$work"

          gh pr create --base main --head "$work" \
            --title "chore: refresh activity" \
            --body "Automated heatmap refresh. Auto-merges once CI is green."

          gh pr merge "$work" --squash --auto --delete-branch \
            || gh pr merge "$work" --squash --delete-branch
